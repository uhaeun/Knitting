# main에 올릴 때마다 안드로이드 APK를 만들어 둔다.
# 만들어진 파일은 Actions 실행 화면 아래 "Artifacts"에서 내려받는다 (90일 보관).
#
# 서명: 지금은 debug 서명이다 (테스터 설치용). 스토어에 올릴 때 release 서명 키를 Secrets에 넣고 바꾼다.
name: 안드로이드 APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 버튼으로도 돌릴 수 있게

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 의존성 설치
        run: npm ci

      - name: 서버 주소가 들어 있는지 확인
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL 비밀값이 없습니다. 이대로 만들면 앱이 '서버 설정이 필요해요' 화면만 띄웁니다."
            exit 1
          fi

      - name: 웹 빌드 (앱 안에 들어갈 화면)
        env:
          # 공개 키다 (브라우저에도 그대로 나간다). 비밀 키가 아니다
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export -p web

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 이름 붙여서 올리기
        uses: actions/upload-artifact@v4
        with:
          name: knitting-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
