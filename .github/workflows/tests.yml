# PR·main에서 lint, 타입 검사와 단위 테스트를 돌린다.
# Supabase를 사용하는 전체 E2E·DB 권한 검사는 e2e.yml에서 별도로 돈다.
name: 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 린트
        run: npm run lint -- --max-warnings 0
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 단위 테스트
        run: npx jest --ci
